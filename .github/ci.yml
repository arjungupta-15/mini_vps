name : mini ci project
 
  on:
    push:
      branches:[ main ]
    pull_request:
       branches:[ main ]

  Job: 
    backend-test:
       push-on: ubuntu-lastest
    steps:
       name:checkout code
       uses: action/checkout@v4

       name:Setup Node.js
       uses: action/setup-node@v4
       with:
        node-version: '20'

        name : Install Dependencies 
        run: npm ci
        working-directory: backend

        name: Run Tests
        run: npm test
        working-directory: backend

  